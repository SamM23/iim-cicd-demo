name: Destroy

# Manual teardown of the prod app stack. Same approval gate as deploy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type destroy to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/terraform-init
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          lock-table: ${{ vars.TF_LOCK_TABLE }}
          region: ${{ vars.AWS_REGION }}
          state-key: ${{ github.event.repository.name }}/prod/terraform.tfstate

      - name: Destroy
        working-directory: terraform
        run: terraform destroy -input=false -auto-approve -var-file=env/prod.tfvars
